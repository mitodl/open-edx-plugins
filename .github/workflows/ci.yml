---
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches:
    - '**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  plugin-docs-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      with:
        fetch-depth: 0

    - name: Find plugins with source changes but no CLAUDE.md update
      id: check
      shell: bash
      run: |
        git fetch origin "${{ github.base_ref }}" --quiet
        changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")

        declare -A src_changed
        declare -A doc_changed

        while IFS= read -r f; do
          [[ -z "$f" ]] && continue
          [[ "$f" =~ ^src/([^/]+)/ ]] || continue
          plugin="${BASH_REMATCH[1]}"
          if [[ "$f" == "src/$plugin/CLAUDE.md" ]]; then
            doc_changed[$plugin]=1
          elif [[ "$f" == *"/tests/"* || "$f" == "src/$plugin/CHANGELOG.rst" ]]; then
            continue
          else
            src_changed[$plugin]=1
          fi
        done <<< "$changed"

        : > flagged_plugins.txt
        for plugin in "${!src_changed[@]}"; do
          [[ -z "${doc_changed[$plugin]:-}" ]] && echo "$plugin" >> flagged_plugins.txt
        done
        sort -o flagged_plugins.txt flagged_plugins.txt
        cat flagged_plugins.txt

    - name: Comment on PR
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        script: |
          const fs = require('fs');
          const flagged = fs.existsSync('flagged_plugins.txt')
            ? fs.readFileSync('flagged_plugins.txt', 'utf8').split('\n').filter(Boolean)
            : [];
          const marker = '<!-- plugin-docs-check -->';

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });
          const existing = comments.find((c) => c.body.includes(marker));

          if (flagged.length === 0) {
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\n✅ No plugin \`CLAUDE.md\` drift detected for this PR's changes.`,
              });
            }
            return;
          }

          const body = [
            marker,
            '### 📋 Plugin docs reminder',
            '',
            "This PR changes plugin source without a matching update to that plugin's `CLAUDE.md`:",
            '',
            ...flagged.map((p) => `- \`src/${p}/CLAUDE.md\``),
            '',
            "If this change affects that plugin's behavior, entry points, or settings, please " +
              'update its `CLAUDE.md` too. If not (e.g. a pure test or formatting change), no ' +
              'action needed — this is a reminder, not a blocking check.',
          ].join('\n');

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

  integration-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python_version:
        - 3.11
        edx_branch:
        - master
        - release/teak
        - release/ulmo

          # Add more branches as needed

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        persist-credentials: false

    - name: Set up uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        enable-cache: true

    - name: Set up Python ${{ matrix.python_version }}
      run: uv python install ${{ matrix.python_version }}

    - name: Build all packages
      run: uv build --all-packages

    - name: Install tutor
      run: |
        if [[ "${{ matrix.edx_branch }}" == "release/teak" ]]; then
          pip install "tutor>=20.0.0,<21.0.0"
        elif [[ "${{ matrix.edx_branch }}" == "master" ]]; then
          git clone --branch=main https://github.com/overhangio/tutor.git
          pip install -e "./tutor"
        else
          pip install "tutor>=21.0.0,<22.0.0"
        fi
    - name: clone edx-platform and add mounts
      run: |
        cd ..
        git clone https://github.com/openedx/edx-platform
        cd edx-platform
        git checkout ${{ matrix.edx_branch }}
        tutor mounts add .

    - name: Build Tutor images
      run: |
        tutor images build openedx-dev

    - name: Launch Tutor
      run: |
        tutor dev launch -I --skip-build
        tutor dev stop

    - name: Run tests on tutor
      run: |
        if [[ "${{ matrix.edx_branch }}" == "master" ]]; then
          DEV="tutor_main_dev"
          DIRECTORY="tutor-main"
        else
          DEV="tutor_dev"
          DIRECTORY="tutor"
        fi
        EDX_WORKSPACE=$PWD/.. docker compose -f /home/runner/.local/share/$DIRECTORY/env/local/docker-compose.yml -f /home/runner/.local/share/$DIRECTORY/env/dev/docker-compose.yml --project-name $DEV run -v $PWD:/openedx/open-edx-plugins lms /openedx/open-edx-plugins/run_edx_integration_tests.sh --mount-dir /openedx/open-edx-plugins
    - name: Upload coverage to CodeCov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      with:
        files: ./coverage.xml
        fail_ci_if_error: false
