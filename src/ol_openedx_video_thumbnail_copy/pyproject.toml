[project]
name = "ol-openedx-video-thumbnail-copy"
version = "0.1.0"
description = "An Open edX plugin to copy a course's video thumbnails from another Open edX instance's storage after course import."
authors = [
  {name = "MIT Office of Digital Learning"}
]
license = "BSD-3-Clause"
readme = "README.rst"
requires-python = ">=3.11"
dependencies = [
  "Django>=5.2",
  "edx-django-utils>=8.0.0",
  "edx-opaque-keys",
  "pillow",
  "requests",
]

[project.entry-points."cms.djangoapp"]
ol_openedx_video_thumbnail_copy = "ol_openedx_video_thumbnail_copy.apps:OLOpenEdxVideoThumbnailCopyConfig"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ol_openedx_video_thumbnail_copy"]
include = [
  "ol_openedx_video_thumbnail_copy/**/*.py",
]

[tool.hatch.build.targets.sdist]
include = [
  "ol_openedx_video_thumbnail_copy/**/*",
  "README.rst",
  "CHANGELOG.rst",
  "pyproject.toml",
]
